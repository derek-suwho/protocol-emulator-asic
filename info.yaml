# Tiny Tapeout project information
project:
  title:        "Programmable Protocol Emulator"      # Project title
  author:       "Derek Su"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "A deterministic, firmware-programmable engine for emulating digital hardware protocols"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"          # Competition allocation; confirmed by Jane Street

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_derek_su_protocol_emulator"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "cfg_data"
  ui[1]: "cfg_shift"
  ui[2]: "cfg_commit"
  ui[3]: "run"
  ui[4]: "reserved_in_4"
  ui[5]: "reserved_in_5"
  ui[6]: "reserved_in_6"
  ui[7]: "reserved_in_7"

  # Outputs
  uo[0]: "status_0"
  uo[1]: "status_1"
  uo[2]: "status_2"
  uo[3]: "status_3"
  uo[4]: "status_4"
  uo[5]: "status_5"
  uo[6]: "status_6"
  uo[7]: "status_7"

  # Bidirectional pins
  uio[0]: "protocol_io_0"
  uio[1]: "protocol_io_1"
  uio[2]: "protocol_io_2"
  uio[3]: "protocol_io_3"
  uio[4]: "protocol_io_4"
  uio[5]: "protocol_io_5"
  uio[6]: "protocol_io_6"
  uio[7]: "protocol_io_7"

# Do not change!
yaml_version: 6
